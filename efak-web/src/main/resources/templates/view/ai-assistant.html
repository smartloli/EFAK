        html[data-theme="dark"] .mcp-param,

        html[data-theme="dark"] .model-provider-icon {

        html[data-theme="dark"] .model-option:hover .model-provider-icon,
        html[data-theme="dark"] .model-option.active .model-provider-icon {

        html[data-theme="dark"] .model-picker-btn,
        html[data-theme="dark"] .mcp-catalog-head,
        html[data-theme="dark"] .mcp-tool-name,
        html[data-theme="dark"] .thinking-section,
        html[data-theme="dark"] .history-item:hover,
        html[data-theme="dark"] .history-item.active,
        html[data-theme="dark"] .markdown-table th,
        html[data-theme="dark"] .table-header,
        html[data-theme="dark"] .code-header {

            border-color: var(--efak-border) !important;

            color: var(--efak-text) !important;

<body class="bg-light-bg text-dark font-inter">
    <div class="flex min-h-screen overflow-hidden">
        <th:block th:replace="~{public/navbar :: navbar}"></th:block>
        <th:block th:replace="~{public/navbar :: overlay}"></th:block>

        <div class="flex-1 flex flex-col overflow-hidden main-content" style="margin-left: 256px;">
            <th:block th:replace="~{public/header :: header}"></th:block>

            <main class="flex-1 overflow-hidden px-4 pt-20 pb-0" style="min-height: 0;">
                <div class="ai-page is-empty">
                    <div class="agent-shell">
                    <header class="agent-topbar">
                        <div class="flex items-center gap-2 min-w-0">
                            <div class="text-sm font-semibold leading-tight text-gray-900">Kafka Copilot</div>
                            <div id="agent-cluster-hint" class="text-xs text-gray-400 truncate"></div>
                        </div>
                        <div class="workspace-actions">
                            <button type="button" id="history-chat-btn" class="icon-btn-ghost" title="历史对话">
                                <i class="fa-solid fa-clock-rotate-left"></i>
                            </button>
                            <button type="button" id="new-chat-btn" class="icon-btn-ghost" title="新建对话">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                        </div>
                    </header>
                        <div class="agent-stage">
                            <div id="agent-empty" class="agent-empty">
                                <div class="agent-empty-kicker">AGENT</div>
                                <h1>有什么可以帮你排查的？</h1>
                                <p id="agent-empty-sub">选一个任务开始，或直接描述 Topic、消费者、集群问题。我会查实时数据再回答。</p>
                                <div id="intent-grid" class="intent-grid"></div>
                            </div>
                            <div id="agent-scroll" class="agent-scroll">
                                <div id="chat-messages" class="agent-thread"></div>
                            </div>
                        </div>

                        <footer class="agent-dock">
                            <div class="composer-inner">
                                <div id="follow-ups" class="follow-ups" hidden></div>
                                <div class="composer-box">
                                    <div id="slash-menu" class="slash-menu" hidden></div>
                                    <textarea id="chat-input" placeholder="随心输入，/new 新建对话"
                                        class="w-full resize-none text-sm"
                                        rows="1"></textarea>
                                    <div class="composer-toolbar">
                                        <div class="flex items-center gap-2 min-w-0">
                                        <div class="model-picker" id="model-picker">
                                            <button type="button" class="model-picker-btn" id="model-picker-btn" title="选择模型">
                                                <i class="fa-solid fa-microchip"></i>
                                                <span class="model-picker-label" id="model-picker-label">加载模型…</span>
                                                <i class="fa-solid fa-chevron-up" style="font-size: 10px;"></i>
                                            </button>
                                            <div class="model-picker-menu" id="model-options">
                                                <div class="text-center text-gray-500 py-4 text-xs">
                                                    <i class="fa fa-spinner fa-spin mr-1"></i>正在加载模型...
                                                </div>
                                            </div>
                                        </div>
                                        </div>
                                        <button id="send-btn" class="composer-send" disabled data-action="send" title="发送">
                                            <i class="fa fa-arrow-up"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </footer>
                    </div>
                </div>

                <input type="checkbox" id="enable-charts" checked hidden>
                <input type="checkbox" id="enable-highlight" checked hidden>

                <div id="history-modal" class="history-modal" aria-hidden="true">
                    <div class="history-dialog" role="dialog" aria-labelledby="history-dialog-title">
                        <div class="history-dialog-header">
                            <div>
                                <div id="history-dialog-title" class="text-sm font-semibold text-gray-900">历史对话</div>
                                <div class="text-xs text-gray-500">搜索并打开之前的会话</div>
                            </div>
                            <button type="button" id="history-close-btn" class="icon-btn-ghost" title="关闭">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                        <div class="history-search">
                            <div class="history-search-wrap">
                                <i class="fa-solid fa-magnifying-glass"></i>
                                <input type="search" id="history-search-input" placeholder="搜索对话标题">
                            </div>
                        </div>
                        <div class="history-list" id="chat-history"></div>
                        <div class="history-pager">
                            <button type="button" id="history-prev-btn">上一页</button>
                            <span id="history-page-info">第 1 / 1 页</span>
                            <button type="button" id="history-next-btn">下一页</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Toggle -->
    <style>
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
        }

        input:checked+.slider {
            background-color: #165DFF;
        }

        input:focus+.slider {
            box-shadow: 0 0 1px #165DFF;
        }

        input:checked+.slider:before {
            transform: translateX(20px);
        }

        .slider.round {
            border-radius: 9999px;
        }

        .slider.round:before {
            border-radius: 50%;
        }
    </style>

    <!-- AI assistant -->
    <script th:src="@{/js/system/ai-assistant.js(v='agent7')}"></script>
</body>

</html>
